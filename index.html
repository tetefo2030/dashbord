<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة المشاريع</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: "Tahoma", sans-serif;
            direction: rtl;
            background: url('background.png') no-repeat bottom right;
            background-size: cover;
            background-color: #f2f4f7;
        }

        /* الشعار */
        .logo {
            text-align: center;
            padding: 25px 10px 10px;
        }

        .logo img {
            width: 130px;
            max-width: 45%;
        }

        /* العنوان */
        .header {
            background: #0a4a8a;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* المحتوى */
        .content {
            padding: 30px 20px 80px;
            text-align: center;
        }

        .content h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .content p {
            color: #555;
            font-size: 16px;
        }

        /* القائمة السفلية */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            right: 0;
            left: 0;
            background: #ffffff;
            border-top: 1px solid #ccc;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.1);
        }

        .bottom-nav a {
            text-decoration: none;
            color: #0a4a8a;
            font-size: 14px;
            text-align: center;
        }

        .bottom-nav i {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        .bottom-nav a:hover {
            color: #083a6c;
        }
    </style>
</head>

<body>

    <!-- الشعار -->
    <div class="logo">
        <img src="logo.png" alt="Hospital Logo">
    </div>

    <!-- العنوان -->
    <div class="header">
        نظام إدارة المشاريع
    </div>

    <!-- المحتوى -->
    <div class="content">
        <h2>مرحباً بك يا أطياف</h2>
        <p>استخدمي القائمة السفلية للتنقل بين صفحات النظام.</p>
    </div>

    <!-- القائمة السفلية -->
    <div class="bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            لوحة التحكم
        </a>

        <a href="project-details.html">
            <i class="fa-solid fa-folder-open"></i>
            تفاصيل المشروع
        </a>

        <a href="timeline.html">
            <i class="fa-solid fa-clock-rotate-left"></i>
            الخط الزمني
        </a>
    </div>

</body>
</html>
