<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تفاصيل المشروع</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: 'Tahoma', sans-serif;
        direction: rtl;
        background: #f0f6fa;
        padding: 20px;
    }

    h2 {
        text-align: center;
        font-size: 26px;
        color: #0a4a8a;
        margin-bottom: 30px;
    }

    .section {
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        margin-bottom: 25px;
    }

    .section-title {
        font-size: 20px;
        font-weight: bold;
        color: #0a4a8a;
        margin-bottom: 15px;
    }

    label {
        font-weight: bold;
        margin-top: 15px;
        display: block;
        color: #333;
    }

    input, textarea, select {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    textarea {
        height: 90px;
        resize: none;
    }

    .owner-row {
        display: flex;
        gap: 15px;
        margin-top: 10px;
    }

    .owner-row input {
        flex: 1;
    }

    .add-owner-btn {
        background: #0a4a8a;
        color: white;
        padding: 12px;
        border-radius: 10px;
        border: none;
        margin-top: 15px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
    }

    .btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        font-size: 18px;
        margin-top: 15px;
        cursor: pointer;
        font-weight: bold;
    }

    .save-btn { background: #0a4a8a; color: white; }
    .upload-btn { background: #5cb85c; color: white; }
    .edit-btn { background: #007bff; color: white; }
    .delete-btn { background: #d9534f; color: white; }
    .back-btn { background: #555; color: white; }

    .date-group {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .date-group select {
        flex: 1;
    }
</style>
</head>

<body>

<h2>تفاصيل المشروع</h2>

<div class="section">
    <div class="section-title">معلومات المشروع</div>

    <label>اسم المشروع</label>
    <input type="text" placeholder="اكتبي اسم المشروع">

    <label>هدف المشروع</label>
    <textarea placeholder="اكتبي هدف المشروع"></textarea>
</div>

<div class="section">
    <div class="section-title">أصحاب المشروع</div>

    <div id="ownersContainer">
        <div class="owner-row">
            <input type="text" placeholder="اسم صاحب المشروع">
            <input type="text" placeholder="دوره في المشروع">
        </div>
    </div>

    <button class="add-owner-btn" onclick="addOwner()">إضافة صاحب مشروع آخر</button>
</div>

<div class="section">
    <div class="section-title">نطاق ومتابعة المشروع</div>

    <label>نطاق المشروع</label>
    <textarea placeholder="اكتبي نطاق المشروع"></textarea>

    <label>متابع المشروع</label>
    <input type="text" placeholder="اسم متابع المشروع">
</div>

<div class="section">
    <div class="section-title">التواريخ</div>

    <label>تاريخ بداية المشروع</label>
    <div class="date-group">
        <select id="startYear"><option value="">السنة</option></select>
        <select id="startMonth"><option value="">الشهر</option></select>
        <select id="startDay"><option value="">اليوم</option></select>
    </div>

    <label>تاريخ نهاية المشروع</label>
    <div class="date-group">
        <select id="endYear"><option value="">السنة</option></select>
        <select id="endMonth"><option value="">الشهر</option></select>
        <select id="endDay"><option value="">اليوم</option></select>
    </div>
</div>

<div class="section">
    <div class="section-title">إجراءات المشروع</div>

    <button class="btn save-btn">حفظ المشروع</button>
    <button class="btn edit-btn">تعديل المشروع</button>
    <button class="btn delete-btn">حذف المشروع</button>
    <button class="btn back-btn" onclick="location.href='index.html'">العودة للصفحة الرئيسية</button>
</div>

<script>
    function addOwner() {
        const container = document.getElementById("ownersContainer");
        const row = document.createElement("div");
        row.className = "owner-row";
        row.innerHTML = `
            <input type="text" placeholder="اسم صاحب المشروع">
            <input type="text" placeholder="دوره في المشروع">
        `;
        container.appendChild(row);
    }

    function fillYears(select) {
        for (let year = 2020; year <= 2035; year++) {
            let option = document.createElement("option");
            option.value = year;
            option.textContent = year;
            select.appendChild(option);
        }
    }

    function fillMonths(select) {
        for (let month = 1; month <= 12; month++) {
            let option = document.createElement("option");
            option.value = month;
            option.textContent = month;
            select.appendChild(option);
        }
    }

    function fillDays(select, month, year) {
        select.innerHTML = '<option value="">اليوم</option>';
        let daysInMonth = 31;

        if (month == 2) {
            daysInMonth = (year % 4 === 0) ? 29 : 28;
        } else if ([4, 6, 9, 11].includes(month)) {
            daysInMonth = 30;
        }

        for (let day = 1; day <= daysInMonth; day++) {
            let option = document.createElement("option");
            option.value = day;
            option.textContent = day;
            select.appendChild(option);
        }
    }

    fillYears(document.getElementById("startYear"));
    fillMonths(document.getElementById("startMonth"));
    fillDays(document.getElementById("startDay"), 1, 2020);

    fillYears(document.getElementById("endYear"));
    fillMonths(document.getElementById("endMonth"));
    fillDays(document.getElementById("endDay"), 1, 2020);

    document.getElementById("startMonth").addEventListener("change", function() {
        fillDays(document.getElementById("startDay"), this.value, document.getElementById("startYear").value);
    });

    document.getElementById("startYear").addEventListener("change", function() {
        fillDays(document.getElementById("startDay"), document.getElementById("startMonth").value, this.value);
    });

    document.getElementById("endMonth").addEventListener("change", function() {
        fillDays(document.getElementById("endDay"), this.value, document.getElementById("endYear").value);
    });

    document.getElementById("endYear").addEventListener("change", function() {
        fillDays(document.getElementById("endDay"), document.getElementById("endMonth").value, this.value);
    });
</script>

</body>
</html>
